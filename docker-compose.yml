version: "3.9"

services:
  tesat-web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://tesat:tesat_secret@postgres:5432/tesat_master
      - REDIS_URL=redis://redis:6379
      - DEFAULT_LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tesat
      POSTGRES_PASSWORD: tesat_secret
      POSTGRES_DB: tesat_master
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
